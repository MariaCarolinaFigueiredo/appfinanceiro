<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nossa Casa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0f2746;--navy2:#17385f;--blue:#2f6fed;--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#6b778c;--line:#dde5ef;--green:#1f9d62;--red:#d64f4f;--shadow:0 10px 30px rgba(15,39,70,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:.82rem}.money{font-variant-numeric:tabular-nums}
#auth{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:#fff}.auth-brand{background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center}.brandmark{width:74px;height:74px;border-radius:22px;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:36px;margin-bottom:28px}.auth-brand h1{font-size:3rem;line-height:1;margin:0 0 16px}.auth-brand p{font-size:1.1rem;max-width:520px;line-height:1.55;color:#d8e5f6}.auth-panel{display:grid;place-items:center;padding:36px}.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:30px}.auth-tabs{display:flex;gap:8px;margin-bottom:22px}.auth-tabs button{flex:1;border:0;background:#edf2f8;padding:11px;border-radius:10px;cursor:pointer}.auth-tabs button.active{background:var(--navy);color:#fff}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:.82rem;color:var(--muted);font-weight:700}.field input,.field select{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;outline:0}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,237,.12)}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff}.btn.secondary{background:#eaf0f7;color:var(--navy)}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{padding:10px 12px;border-radius:10px;margin-top:12px;font-size:.88rem}.msg.err{background:#fff1f1;color:#9f2d2d}.msg.ok{background:#edf9f3;color:#147044}
#app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:var(--navy);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 24px;font-weight:900;font-size:1.15rem}.logo span:first-child{width:38px;height:38px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c9d7e8;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer}.nav button:hover,.nav button.active{background:#24476f;color:#fff}.side-bottom{margin-top:28px;border-top:1px solid rgba(255,255,255,.12);padding-top:14px}.main{padding:24px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.topbar h2{margin:0}.top-actions{display:flex;align-items:center;gap:9px}.chip{background:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-size:.82rem}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}.stat .label{font-size:.78rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}.stat .value{font-size:1.55rem;font-weight:900;margin-top:7px}.layout2{display:grid;grid-template-columns:1.45fr .75fr;gap:16px;margin-top:16px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.section-title h3{margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-size:.76rem;text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:.72rem;font-weight:800}.badge.green{background:#eaf8f1;color:#147044}.badge.red{background:#fff0f0;color:#a63535}.badge.blue{background:#edf3ff;color:#2757b6}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form-grid .span2{grid-column:1/-1}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.progress{height:9px;background:#e8eef5;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--green)}.hero{background:linear-gradient(135deg,#fff,#edf4ff);border:1px solid #d8e6fb;border-radius:20px;padding:26px;margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:2rem}.hero p{margin:0;color:var(--muted);max-width:700px}.consult{background:var(--navy);color:#fff}.consult p{color:#cbd9ea;line-height:1.5}.recommend{padding:12px;border-radius:12px;background:#f7f9fc;margin-top:10px}.modal-bg{position:fixed;inset:0;background:rgba(5,18,35,.55);display:grid;place-items:center;padding:18px;z-index:20}.modal{background:#fff;width:min(640px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h3{margin:0}.iconbtn{border:0;background:#eef2f7;border-radius:9px;padding:8px 10px;cursor:pointer}
@media(max-width:1000px){#app{grid-template-columns:84px 1fr}.sidebar .txt{display:none}.grid4{grid-template-columns:repeat(2,1fr)}.layout2{grid-template-columns:1fr}.logo{justify-content:center}.nav button{text-align:center}}
@media(max-width:700px){#auth{grid-template-columns:1fr}.auth-brand{display:none}#app{grid-template-columns:1fr}.sidebar{height:auto;position:relative;display:flex;overflow:auto;padding:10px}.logo{display:none}.nav{display:flex}.nav button{white-space:nowrap}.side-bottom{display:none}.main{padding:14px}.grid4,.form-grid{grid-template-columns:1fr}.form-grid .span2{grid-column:auto}.topbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<section id="auth">
  <div class="auth-brand"><div class="brandmark">⌂</div><h1>Nossa Casa</h1><p>Controle financeiro compartilhado para organizar renda, despesas, contas, dívidas, investimentos e metas em um só lugar.</p></div>
  <div class="auth-panel"><div class="auth-card">
    <div class="auth-tabs"><button id="tabLogin" class="active" onclick="setAuthMode('login')">Entrar</button><button id="tabSignup" onclick="setAuthMode('signup')">Criar conta</button></div>
    <h2 id="authTitle">Acesso seguro</h2><p class="muted" id="authHelp">Entre com seu e-mail e senha.</p>
    <div class="field"><label>E-mail</label><input id="authEmail" type="email" autocomplete="email"></div>
    <div class="field"><label>Senha</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6"></div>
    <button id="authSubmit" class="btn" style="width:100%" onclick="submitAuth()">Entrar</button>
    <div id="authMsg"></div>
  </div></div>
</section>
<section id="app" class="hidden">
  <aside class="sidebar"><div class="logo"><span>⌂</span><span class="txt">Nossa Casa</span></div><div class="nav" id="nav"></div><div class="side-bottom"><button class="btn ghost" style="width:100%;color:#fff;border-color:#55708f" onclick="logout()">Sair</button></div></aside>
  <main class="main"><div class="topbar"><div><h2 id="pageTitle">Início</h2><div class="muted small" id="familyLabel"></div></div><div class="top-actions"><span id="userChip" class="chip"></span><button class="btn secondary" onclick="refreshAll()">Atualizar</button></div></div><div id="content"></div></main>
</section>
<div id="modalRoot"></div>
<script>
const SUPABASE_URL='https://satkulchimdnnczsdqoh.supabase.co';
const SUPABASE_KEY='sb_publishable_TOdTZAZ11zPvU_dA2M14ZA_c2efUJef';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let authMode='login', session=null, familyId=null, family=null, role=null;
let data={members:[],transactions:[],bank_accounts:[],credit_cards:[],debts:[],investments:[],financial_goals:[]};
let currentView='home';
const views=[['home','⌂','Início'],['family','♙','Renda & Família'],['budget','▦','Orçamento'],['accounts','▣','Contas & Cartões'],['expenses','↘','Despesas'],['debts','≋','Dívidas'],['investments','↗','Investimentos'],['goals','◎','Metas & Planos'],['consultant','✦','Consultor Financeiro'],['reports','▤','Relatórios']];
const fmt=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function setAuthMode(m){authMode=m;tabLogin.classList.toggle('active',m==='login');tabSignup.classList.toggle('active',m==='signup');authTitle.textContent=m==='login'?'Acesso seguro':'Criar acesso';authHelp.textContent=m==='login'?'Entre com seu e-mail e senha.':'Crie sua conta para começar o orçamento da família.';authSubmit.textContent=m==='login'?'Entrar':'Criar conta';authMsg.innerHTML=''}
function authMessage(text,type='err'){authMsg.innerHTML=`<div class="msg ${type}">${esc(text)}</div>`}
async function submitAuth(){const email=authEmail.value.trim(),password=authPassword.value;if(!email||!password)return authMessage('Informe e-mail e senha.');authSubmit.disabled=true;try{if(authMode==='login'){const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}else{const {data:r,error}=await sb.auth.signUp({email,password});if(error)throw error;if(r.session){authMessage('Conta criada e acesso liberado.','ok')}else authMessage('Conta criada. Confirme seu e-mail e depois entre no app.','ok')}}catch(e){authMessage(e.message||'Não foi possível concluir o acesso.')}finally{authSubmit.disabled=false}}
async function logout(){await sb.auth.signOut();location.reload()}
sb.auth.onAuthStateChange((_e,s)=>{session=s;if(s)boot();else{auth.classList.remove('hidden');app.classList.add('hidden')}});
async function boot(){auth.classList.add('hidden');app.classList.remove('hidden');userChip.textContent=session.user.email;renderNav();await resolveFamily()}
function renderNav(){nav.innerHTML=views.map(([id,ic,txt])=>`<button class="${currentView===id?'active':''}" onclick="showView('${id}')"><span>${ic}</span> <span class="txt">${txt}</span></button>`).join('')}
async function resolveFamily(){const {data:links,error}=await sb.from('family_users').select('family_id,role,families(id,name,minimum_protection)').eq('user_id',session.user.id).eq('active',true).limit(1);if(error)return renderFatal(error.message);if(!links?.length){familyId=null;family=null;renderOnboarding();return}familyId=links[0].family_id;role=links[0].role;family=links[0].families;familyLabel.textContent=`${family?.name||'Orçamento familiar'} · ${role}`;await refreshAll()}
function renderOnboarding(){familyLabel.textContent='Primeira configuração';content.innerHTML=`<div class="hero"><h1>Vamos preparar sua casa</h1><p>Crie o orçamento familiar. Depois você poderá cadastrar integrantes, renda, despesas, contas, dívidas, investimentos e metas.</p></div><div class="card" style="max-width:560px"><div class="field"><label>Nome do orçamento familiar</label><input id="familyName" placeholder="Ex.: Nossa Casa"></div><button class="btn" onclick="createFamily()">Criar orçamento</button><div id="familyCreateMsg"></div></div>`}
async function createFamily(){const name=familyName.value.trim();if(!name)return;const {data:fid,error}=await sb.rpc('create_family',{family_name:name});if(error){familyCreateMsg.innerHTML=`<div class="msg err">${esc(error.message)}</div>`;return}familyId=fid;await resolveFamily()}
async function refreshAll(){if(!familyId)return;for(const t of Object.keys(data)){let q=sb.from(t).select('*').eq('family_id',familyId);q=t==='transactions'?q.order('competence_date',{ascending:false}):q.order('created_at',{ascending:false});const r=await q;data[t]=r.error?[]:(r.data||[])}showView(currentView,false)}
function showView(id,refreshNav=true){currentView=id;if(refreshNav)renderNav();pageTitle.textContent=views.find(v=>v[0]===id)?.[2]||'Nossa Casa';({home:renderHome,family:renderFamily,budget:renderBudget,accounts:renderAccounts,expenses:renderExpenses,debts:renderDebts,investments:renderInvestments,goals:renderGoals,consultant:renderConsultant,reports:renderReports}[id]||(()=>{}))()}
function totals(){const month=new Date().toISOString().slice(0,7),tx=data.transactions.filter(t=>String(t.competence_date).startsWith(month));const income=tx.filter(t=>t.kind==='income').reduce((s,t)=>s+Number(t.amount),0);const expense=tx.filter(t=>t.kind==='expense'&&t.status!=='cancelled').reduce((s,t)=>s+Number(t.amount),0);const reserve=data.bank_accounts.reduce((s,a)=>s+Number(a.balance||0),0)+data.investments.reduce((s,a)=>s+Number(a.current_value||0),0);const debt=data.debts.filter(d=>d.active).reduce((s,d)=>s+Number(d.outstanding_balance||0),0);return{income,expense,reserve,debt,balance:income-expense}}
function renderHome(){const t=totals(),goal=data.financial_goals.find(g=>g.status==='active');content.innerHTML=`<div class="hero"><h1>Bem-vindo(a).</h1><p>Acompanhe o orçamento da família e transforme os próximos passos em decisões financeiras mais previsíveis.</p></div><div class="grid4"><div class="card stat"><div class="label">Renda mensal</div><div class="value">${fmt(t.income)}</div></div><div class="card stat"><div class="label">Despesas mensais</div><div class="value">${fmt(t.expense)}</div></div><div class="card stat"><div class="label">Reserva + investimentos</div><div class="value">${fmt(t.reserve)}</div></div><div class="card stat"><div class="label">Saldo do mês</div><div class="value" style="color:${t.balance>=0?'var(--green)':'var(--red)'}">${fmt(t.balance)}</div></div></div><div class="layout2"><div class="card"><div class="section-title"><h3>Movimentações recentes</h3><button class="btn" onclick="openTransaction()">+ Lançamento</button></div>${txTable(data.transactions.slice(0,8))}</div><div class="card consult"><h3>Próximo objetivo</h3>${goal?`<p><strong>${esc(goal.name)}</strong></p><div class="progress"><i style="width:${Math.min(100,Number(goal.current_amount)/Number(goal.target_amount)*100)}%"></i></div><p>${fmt(goal.current_amount)} de ${fmt(goal.target_amount)}</p>`:'<p>Cadastre uma meta para acompanhar o progresso aqui.</p>'}<button class="btn secondary" onclick="showView('goals')">Ver metas</button></div></div>`}
function txTable(rows){if(!rows.length)return'<div class="empty">Nenhum lançamento cadastrado.</div>';return`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.competence_date||''}</td><td>${esc(x.description)}</td><td>${esc(x.category)}</td><td><span class="badge ${x.kind==='income'?'green':'red'}">${x.kind==='income'?'Renda':'Despesa'}</span></td><td>${fmt(x.amount)}</td><td><button class="iconbtn" onclick="deleteRow('transactions','${x.id}')">Excluir</button></td></tr>`).join('')}</tbody></table></div>`}
function renderFamily(){const inc=data.transactions.filter(t=>t.kind==='income').slice(0,20);content.innerHTML=`<div class="layout2"><div class="card"><div class="section-title"><h3>Integrantes</h3><button class="btn" onclick="openMember()">+ Integrante</button></div>${listTable('members',data.members,[['name','Nome'],['relationship','Parentesco'],['kind','Tipo']])}</div><div class="card"><div class="section-title"><h3>Renda</h3><button class="btn" onclick="openTransaction('income')">+ Renda</button></div>${txTable(inc)}</div></div>`}
function renderBudget(){const cats={};data.transactions.filter(t=>t.kind==='expense').forEach(t=>cats[t.category]=(cats[t.category]||0)+Number(t.amount));const total=Object.values(cats).reduce((a,b)=>a+b,0);content.innerHTML=`<div class="card"><div class="section-title"><h3>Distribuição das despesas</h3><button class="btn" onclick="openTransaction('expense')">+ Despesa</button></div>${Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><strong>${esc(k)}</strong><span>${fmt(v)} · ${(v/total*100).toFixed(1)}%</span></div><div class="progress"><i style="width:${v/total*100}%"></i></div></div>`).join(''):'<div class="empty">Cadastre despesas para visualizar o orçamento.</div>'}</div>`}
function renderAccounts(){content.innerHTML=`<div class="layout2"><div class="card"><div class="section-title"><h3>Contas bancárias</h3><button class="btn" onclick="openAccount()">+ Conta</button></div>${listTable('bank_accounts',data.bank_accounts,[['name','Conta'],['institution','Instituição'],['balance','Saldo','money']])}</div><div class="card"><div class="section-title"><h3>Cartões</h3><button class="btn" onclick="openCard()">+ Cartão</button></div>${listTable('credit_cards',data.credit_cards,[['name','Cartão'],['last_digits','Final'],['current_invoice','Fatura','money']])}</div></div>`}
function renderExpenses(){content.innerHTML=`<div class="card"><div class="section-title"><h3>Despesas</h3><button class="btn" onclick="openTransaction('expense')">+ Despesa</button></div>${txTable(data.transactions.filter(t=>t.kind==='expense'))}</div>`}
function renderDebts(){content.innerHTML=`<div class="card"><div class="section-title"><h3>Dívidas</h3><button class="btn" onclick="openDebt()">+ Dívida</button></div>${listTable('debts',data.debts,[['name','Dívida'],['creditor','Credor'],['outstanding_balance','Saldo devedor','money'],['installment_amount','Parcela','money']])}</div>`}
function renderInvestments(){content.innerHTML=`<div class="card"><div class="section-title"><h3>Investimentos</h3><button class="btn" onclick="openInvestment()">+ Investimento</button></div>${listTable('investments',data.investments,[['name','Produto'],['institution','Instituição'],['product_type','Tipo'],['current_value','Valor atual','money']])}</div>`}
function renderGoals(){content.innerHTML=`<div class="card"><div class="section-title"><h3>Metas e planos</h3><button class="btn" onclick="openGoal()">+ Meta</button></div>${data.financial_goals.length?data.financial_goals.map(g=>{const p=Math.min(100,Number(g.current_amount)/Number(g.target_amount)*100);return`<div class="recommend"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${esc(g.name)}</strong><button class="iconbtn" onclick="deleteRow('financial_goals','${g.id}')">Excluir</button></div><div class="muted small">${esc(g.category)} · prioridade ${g.priority}</div><div class="progress" style="margin:9px 0"><i style="width:${p}%"></i></div><div>${fmt(g.current_amount)} de ${fmt(g.target_amount)} (${p.toFixed(0)}%)</div></div>`}).join(''):'<div class="empty">Nenhuma meta cadastrada.</div>'}</div>`}
function renderConsultant(){const t=totals(),recs=[];if(t.debt>0)recs.push(['Prioridade alta','Dívidas ativas','Mapeie taxa, parcela e saldo devedor. Priorize as dívidas de maior custo antes de ampliar aportes de longo prazo.']);if(t.expense>t.income&&t.income>0)recs.push(['Prioridade alta','Orçamento negativo','As despesas do mês superam a renda. Revise gastos variáveis e vencimentos antes de assumir novas parcelas.']);if(t.reserve<t.expense*3&&t.expense>0)recs.push(['Prioridade média','Reserva de emergência','A reserva registrada está abaixo de três meses das despesas atuais.']);if(!recs.length)recs.push(['Acompanhamento','Estrutura inicial','Cadastre renda, despesas, dívidas, contas e metas para receber recomendações mais específicas.']);content.innerHTML=`<div class="card consult"><h3>Consultor Financeiro Familiar</h3><p>As recomendações abaixo usam somente os valores cadastrados no app. São orientações de organização financeira e não substituem aconselhamento profissional individual.</p>${recs.map(r=>`<div class="recommend" style="color:var(--ink)"><span class="badge blue">${r[0]}</span><h4>${r[1]}</h4><div>${r[2]}</div></div>`).join('')}</div>`}
function renderReports(){const t=totals();content.innerHTML=`<div class="grid4"><div class="card stat"><div class="label">Renda</div><div class="value">${fmt(t.income)}</div></div><div class="card stat"><div class="label">Despesas</div><div class="value">${fmt(t.expense)}</div></div><div class="card stat"><div class="label">Dívidas</div><div class="value">${fmt(t.debt)}</div></div><div class="card stat"><div class="label">Patrimônio financeiro</div><div class="value">${fmt(t.reserve)}</div></div></div><div class="card" style="margin-top:16px"><h3>Indicadores</h3><p>Comprometimento do mês: <strong>${t.income?((t.expense/t.income)*100).toFixed(1):0}%</strong></p><p>Saldo mensal: <strong>${fmt(t.balance)}</strong></p><p>Relação dívida/renda mensal: <strong>${t.income?((t.debt/t.income)*100).toFixed(1):0}%</strong></p></div>`}
function listTable(table,rows,cols){if(!rows.length)return'<div class="empty">Nenhum registro cadastrado.</div>';return`<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[2]==='money'?fmt(r[c[0]]):esc(r[c[0]])}</td>`).join('')}<td><button class="iconbtn" onclick="deleteRow('${table}','${r.id}')">Excluir</button></td></tr>`).join('')}</tbody></table></div>`}
function modal(title,body,save){modalRoot.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="iconbtn" onclick="closeModal()">✕</button></div>${body}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="${save}">Salvar</button></div><div id="modalMsg"></div></div></div>`}
function closeModal(){modalRoot.innerHTML=''}function modalErr(e){modalMsg.innerHTML=`<div class="msg err">${esc(e.message||e)}</div>`}
async function insert(table,payload){const {error}=await sb.from(table).insert({...payload,family_id:familyId});if(error)throw error;closeModal();await refreshAll()}
async function deleteRow(table,id){if(!confirm('Excluir este registro?'))return;const {error}=await sb.from(table).delete().eq('id',id);if(error)return alert(error.message);await refreshAll()}
const memberOptions=()=>`<option value="">Sem vínculo</option>${data.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}`;
function openTransaction(kind='expense'){modal(kind==='income'?'Nova renda':'Nova despesa',`<div class="form-grid"><div class="field"><label>Tipo</label><select id="fkind"><option value="income" ${kind==='income'?'selected':''}>Renda</option><option value="expense" ${kind==='expense'?'selected':''}>Despesa</option></select></div><div class="field"><label>Data</label><input id="fdate" type="date" value="${today()}"></div><div class="field span2"><label>Descrição</label><input id="fdesc"></div><div class="field"><label>Categoria</label><input id="fcat" placeholder="Ex.: Moradia, Salário"></div><div class="field"><label>Valor</label><input id="famount" type="number" step="0.01" min="0"></div><div class="field"><label>Integrante</label><select id="fmember">${memberOptions()}</select></div><div class="field"><label>Status</label><select id="fstatus"><option value="paid">Pago/recebido</option><option value="pending">Pendente</option><option value="planned">Planejado</option></select></div></div>`,'saveTransaction()')}
async function saveTransaction(){try{await insert('transactions',{kind:fkind.value,description:fdesc.value.trim(),category:fcat.value.trim()||'Outros',amount:Number(famount.value),competence_date:fdate.value,status:fstatus.value,member_id:fmember.value||null,paid_at:fstatus.value==='paid'?fdate.value:null})}catch(e){modalErr(e)}}
function openMember(){modal('Novo integrante',`<div class="form-grid"><div class="field span2"><label>Nome</label><input id="mname"></div><div class="field"><label>Parentesco</label><input id="mrel" placeholder="Ex.: Titular, cônjuge, filho(a)"></div><div class="field"><label>Tipo</label><select id="mkind"><option value="adult">Adulto</option><option value="dependent">Dependente</option></select></div><div class="field"><label>Data de nascimento</label><input id="mbirth" type="date"></div><div class="field"><label>Recebe renda?</label><select id="mearner"><option value="false">Não</option><option value="true">Sim</option></select></div></div>`,'saveMember()')}
async function saveMember(){try{await insert('members',{name:mname.value.trim(),relationship:mrel.value.trim()||'Familiar',kind:mkind.value,birth_date:mbirth.value||null,income_earner:mearner.value==='true'})}catch(e){modalErr(e)}}
function openAccount(){modal('Nova conta bancária',`<div class="form-grid"><div class="field"><label>Nome</label><input id="aname"></div><div class="field"><label>Instituição</label><input id="ainst"></div><div class="field"><label>Tipo</label><input id="atype" placeholder="Corrente, pagamento..."></div><div class="field"><label>Saldo</label><input id="abal" type="number" step="0.01" value="0"></div><div class="field"><label>Tarifa mensal</label><input id="afee" type="number" step="0.01" value="0"></div><div class="field"><label>Rendimento automático?</label><select id="ayield"><option value="false">Não</option><option value="true">Sim</option></select></div></div>`,'saveAccount()')}
async function saveAccount(){try{await insert('bank_accounts',{name:aname.value.trim(),institution:ainst.value.trim(),account_type:atype.value.trim()||'Conta',balance:Number(abal.value||0),monthly_fee:Number(afee.value||0),automatic_yield:ayield.value==='true'})}catch(e){modalErr(e)}}
function openCard(){modal('Novo cartão',`<div class="form-grid"><div class="field span2"><label>Nome</label><input id="cname"></div><div class="field"><label>4 últimos dígitos</label><input id="cdigits" maxlength="4"></div><div class="field"><label>Limite</label><input id="climit" type="number" step="0.01" value="0"></div><div class="field"><label>Fatura atual</label><input id="cinvoice" type="number" step="0.01" value="0"></div><div class="field"><label>Vencimento (dia)</label><input id="cdue" type="number" min="1" max="31"></div></div>`,'saveCard()')}
async function saveCard(){try{await insert('credit_cards',{name:cname.value.trim(),last_digits:cdigits.value.trim()||null,credit_limit:Number(climit.value||0),family_limit:Number(climit.value||0),current_invoice:Number(cinvoice.value||0),due_day:cdue.value?Number(cdue.value):null})}catch(e){modalErr(e)}}
function openDebt(){modal('Nova dívida',`<div class="form-grid"><div class="field"><label>Nome</label><input id="dname"></div><div class="field"><label>Credor</label><input id="dcred"></div><div class="field"><label>Tipo</label><input id="dtype"></div><div class="field"><label>Saldo devedor</label><input id="dbal" type="number" step="0.01"></div><div class="field"><label>Parcela</label><input id="dinst" type="number" step="0.01" value="0"></div><div class="field"><label>Taxa mensal %</label><input id="drate" type="number" step="0.01" value="0"></div></div>`,'saveDebt()')}
async function saveDebt(){try{await insert('debts',{name:dname.value.trim(),creditor:dcred.value.trim(),debt_type:dtype.value.trim()||'Outros',outstanding_balance:Number(dbal.value),installment_amount:Number(dinst.value||0),monthly_rate_percent:Number(drate.value||0)})}catch(e){modalErr(e)}}
function openInvestment(){modal('Novo investimento',`<div class="form-grid"><div class="field"><label>Instituição</label><input id="iinst"></div><div class="field"><label>Produto</label><input id="iname"></div><div class="field"><label>Tipo</label><input id="itype" placeholder="CDB, Tesouro..."></div><div class="field"><label>Valor investido</label><input id="iinv" type="number" step="0.01" value="0"></div><div class="field"><label>Valor atual</label><input id="icurr" type="number" step="0.01" value="0"></div><div class="field"><label>Liquidez</label><input id="iliq"></div></div>`,'saveInvestment()')}
async function saveInvestment(){try{await insert('investments',{institution:iinst.value.trim(),name:iname.value.trim(),product_type:itype.value.trim()||'Investimento',invested_amount:Number(iinv.value||0),current_value:Number(icurr.value||0),liquidity:iliq.value.trim()||null})}catch(e){modalErr(e)}}
function openGoal(){modal('Nova meta',`<div class="form-grid"><div class="field"><label>Nome</label><input id="gname"></div><div class="field"><label>Categoria</label><input id="gcat" placeholder="Viagem, veículo, reserva..."></div><div class="field"><label>Valor-alvo</label><input id="gtarget" type="number" step="0.01"></div><div class="field"><label>Valor atual</label><input id="gcurrent" type="number" step="0.01" value="0"></div><div class="field"><label>Aporte mensal</label><input id="gmonthly" type="number" step="0.01" value="0"></div><div class="field"><label>Prioridade (1-5)</label><input id="gpriority" type="number" min="1" max="5" value="3"></div></div>`,'saveGoal()')}
async function saveGoal(){try{await insert('financial_goals',{name:gname.value.trim(),category:gcat.value.trim()||'Objetivo',target_amount:Number(gtarget.value),current_amount:Number(gcurrent.value||0),monthly_contribution:Number(gmonthly.value||0),priority:Number(gpriority.value||3)})}catch(e){modalErr(e)}}
function renderFatal(msg){content.innerHTML=`<div class="msg err">${esc(msg)}</div>`}
(async()=>{const {data:{session:s}}=await sb.auth.getSession();session=s;if(s)boot()})();
</script>
</body>
</html>
