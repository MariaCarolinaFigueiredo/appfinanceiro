<body>
<section id="auth">
  <div class="auth-brand"><div class="brandmark"><img src="/logo-nossa-casa.png" alt="Logo Nossa Casa"></div><h1>Nossa Casa</h1><p>Controle financeiro compartilhado para organizar renda, despesas, contas, dívidas, investimentos e metas em um só lugar.</p></div>
  <div class="auth-panel"><div class="auth-card">
    <div class="auth-tabs"><button id="tabLogin" class="active" onclick="setAuthMode('login')">Entrar</button><button id="tabSignup" onclick="setAuthMode('signup')">Criar conta</button></div>
    <h2 id="authTitle">Acesso seguro</h2><p class="muted" id="authHelp">Entre com seu e-mail e senha.</p>
    <div class="field"><label>E-mail</label><input id="authEmail" type="email" autocomplete="email"></div>
    <div class="field"><label>Senha</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6"></div>
    <button id="authSubmit" class="btn" style="width:100%" onclick="submitAuth()">Entrar</button>
    <div id="authMsg"></div>
  </div></div>
</section>
<section id="app" class="hidden">
  <aside class="sidebar"><div class="logo"><img class="logo-img" src="/logo-nossa-casa.png" alt="Logo Nossa Casa"><span class="txt">Nossa Casa</span></div><div class="nav" id="nav"></div><div class="side-bottom"><button class="btn ghost" style="width:100%;color:#fff;border-color:#55708f" onclick="logout()">Sair</button></div></aside>
  <main class="main"><div class="topbar"><div><h2 id="pageTitle">Início</h2><div class="muted small" id="familyLabel"></div></div><div class="top-actions"><div class="period-control"><button class="iconbtn" onclick="shiftPeriod(-1)">‹</button><input id="periodPicker" type="month" onchange="setPeriod(this.value)"><button class="iconbtn" onclick="shiftPeriod(1)">›</button></div><span id="userChip" class="chip"></span><button id="installBtn" class="btn secondary hidden" onclick="installApp()">Instalar</button><button class="btn secondary" onclick="refreshAll()">Atualizar</button></div></div><div id="content"></div></main>
</section>
<div id="modalRoot"></div>
<script>
const SUPABASE_URL='https://satkulchimdnnczsdqoh.supabase.co';
const SUPABASE_KEY='sb_publishable_TOdTZAZ11zPvU_dA2M14ZA_c2efUJef';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let authMode='login', session=null, familyId=null, family=null, role=null;
let data={members:[],transactions:[],bank_accounts:[],credit_cards:[],debts:[],investments:[],financial_goals:[]};
let currentView='home';
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;const b=document.getElementById('installBtn');if(b)b.classList.remove('hidden')});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;const b=document.getElementById('installBtn');if(b)b.classList.add('hidden')});
async function installApp(){if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installBtn.classList.add('hidden')}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));

let currentPeriod=new Date().toISOString().slice(0,7);
const views=[['home','⌂','Início'],['family','♙','Renda & Família'],['budget','▦','Orçamento'],['accounts','▣','Contas & Cartões'],['expenses','↘','Despesas'],['debts','≋','Dívidas'],['investments','↗','Investimentos'],['goals','◎','Metas & Planos'],['consultant','✦','Consultor Financeiro'],['reports','▤','Relatórios']];
const fmt=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const monthLabel=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())};
const addMonths=(ym,n)=>{const [y,m]=ym.split('-').map(Number),d=new Date(y,m-1+n,1);return d.toISOString().slice(0,7)};
function setPeriod(v){if(!v)return;currentPeriod=v;periodPicker.value=v;showView(currentView,false)}
function shiftPeriod(n){setPeriod(addMonths(currentPeriod,n))}
function setAuthMode(m){authMode=m;tabLogin.classList.toggle('active',m==='login');tabSignup.classList.toggle('active',m==='signup');authTitle.textContent=m==='login'?'Acesso seguro':'Criar acesso';authHelp.textContent=m==='login'?'Entre com seu e-mail e senha.':'Crie sua conta para começar o orçamento da família.';authSubmit.textContent=m==='login'?'Entrar':'Criar conta';authMsg.innerHTML=''}
function authMessage(text,type='err'){authMsg.innerHTML=`<div class="msg ${type}">${esc(text)}</div>`}
async function submitAuth(){const email=authEmail.value.trim(),password=authPassword.value;if(!email||!password)return authMessage('Informe e-mail e senha.');authSubmit.disabled=true;try{if(authMode==='login'){const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}else{const {data:r,error}=await sb.auth.signUp({email,password});if(error)throw error;if(r.session){authMessage('Conta criada e acesso liberado.','ok')}else authMessage('Conta criada. Confirme seu e-mail e depois entre no app.','ok')}}catch(e){authMessage(e.message||'Não foi possível concluir o acesso.')}finally{authSubmit.disabled=false}}
async function logout(){await sb.auth.signOut();location.reload()}
sb.auth.onAuthStateChange((_e,s)=>{session=s;if(s)boot();else{auth.classList.remove('hidden');app.classList.add('hidden')}});
async function boot(){auth.classList.add('hidden');app.classList.remove('hidden');userChip.textContent=session.user.email;periodPicker.value=currentPeriod;renderNav();await resolveFamily()}
function renderNav(){const mobile=window.matchMedia('(max-width:700px)').matches;if(mobile){const moreIds=['family','accounts','expenses','debts','investments','consultant','reports'];const items=[['home','⌂','Início'],['transactions','▤','Lançamentos'],['budget','▦','Orçamento'],['goals','◎','Metas'],['more','⋯','Mais']];nav.innerHTML=items.map(([id,ic,txt])=>`<button class="${currentView===id||(id==='more'&&moreIds.includes(currentView))?'active':''}" onclick="${id==='more'?'openMoreMenu()':`showView('${id}')`}"><span>${ic}</span><span class="txt">${txt}</span></button>`).join('')}else{nav.innerHTML=views.map(([id,ic,txt])=>`<button class="${currentView===id?'active':''}" onclick="showView('${id}')"><span>${ic}</span> <span class="txt">${txt}</span></button>`).join('')}}
function openMoreMenu(){modal('Mais',`<div class="more-menu"><button onclick="closeModal();showView('family')">Renda & Família</button><button onclick="closeModal();showView('accounts')">Contas & Cartões</button><button onclick="closeModal();showView('expenses')">Despesas</button><button onclick="closeModal();showView('debts')">Dívidas</button><button onclick="closeModal();showView('investments')">Investimentos</button><button onclick="closeModal();showView('consultant')">Consultor Financeiro</button><button onclick="closeModal();showView('reports')">Relatórios</button><button class="danger" onclick="logout()">Sair</button></div>`)}
window.addEventListener('resize',()=>renderNav())
async function resolveFamily(){const {data:links,error}=await sb.from('family_users').select('family_id,role,families(id,name,minimum_protection)').eq('user_id',session.user.id).eq('active',true).limit(1);if(error)return renderFatal(error.message);if(!links?.length){familyId=null;family=null;renderOnboarding();return}familyId=links[0].family_id;role=links[0].role;family=links[0].families;familyLabel.textContent=`${family?.name||'Orçamento familiar'} · ${role}`;await refreshAll()}
function renderOnboarding(){familyLabel.textContent='Primeira configuração';content.innerHTML=`<div class="hero"><h1>Vamos preparar sua casa</h1><p>Crie o orçamento familiar. Depois você poderá cadastrar integrantes, renda, despesas, contas, dívidas, investimentos e metas.</p></div><div class="card" style="max-width:560px"><div class="field"><label>Nome do orçamento familiar</label><input id="familyName" placeholder="Ex.: Nossa Casa"></div><button class="btn" onclick="createFamily()">Criar orçamento</button><div id="familyCreateMsg"></div></div>`}
async function createFamily(){const name=familyName.value.trim();if(!name)return;const {data:fid,error}=await sb.rpc('create_family',{family_name:name});if(error){familyCreateMsg.innerHTML=`<div class="msg err">${esc(error.message)}</div>`;return}familyId=fid;await resolveFamily()}
async function refreshAll(){if(!familyId)return;for(const t of Object.keys(data)){let q=sb.from(t).select('*').eq('family_id',familyId);q=t==='transactions'?q.order('competence_date',{ascending:false}):q.order('created_at',{ascending:false});const r=await q;data[t]=r.error?[]:(r.data||[])}periodPicker.value=currentPeriod;showView(currentView,false)}
function showView(id,refreshNav=true){currentView=id;if(refreshNav)renderNav();pageTitle.textContent=id==='transactions'?'Lançamentos':(views.find(v=>v[0]===id)?.[2]||'Nossa Casa');({home:renderHome,transactions:renderTransactions,family:renderFamily,budget:renderBudget,accounts:renderAccounts,expenses:renderExpenses,debts:renderDebts,investments:renderInvestments,goals:renderGoals,consultant:renderConsultant,reports:renderReports}[id]||(()=>{}))()}
function monthTransactions(month=currentPeriod){return data.transactions.filter(t=>String(t.competence_date||'').startsWith(month)&&t.status!=='cancelled')}
function totals(month=currentPeriod){const tx=monthTransactions(month);const income=tx.filter(t=>t.kind==='income').reduce((s,t)=>s+Number(t.amount),0);const expense=tx.filter(t=>t.kind==='expense').reduce((s,t)=>s+Number(t.amount),0);const reserve=data.bank_accounts.reduce((s,a)=>s+Number(a.balance||0),0)+data.investments.reduce((s,a)=>s+Number(a.current_value||0),0);const debt=data.debts.filter(d=>d.active!==false).reduce((s,d)=>s+Number(d.outstanding_balance||0),0);return{income,expense,reserve,debt,balance:income-expense}}
function renderHome(){const t=totals(),goal=data.financial_goals.filter(g=>g.status==='active').sort((a,b)=>(a.priority||9)-(b.priority||9))[0],tx=monthTransactions().sort((a,b)=>String(b.competence_date).localeCompare(String(a.competence_date))).slice(0,8);content.innerHTML=`<div class="hero"><div class="muted small" style="font-weight:900;letter-spacing:.08em">CONTROLE FINANCEIRO FAMILIAR · ${monthLabel(currentPeriod)}</div><h1>Bem-vindo(a).</h1><p>Acompanhe renda, despesas e projeções da família com o mês de referência sempre visível.</p></div><div class="grid4"><div class="card stat"><div class="label">Renda mensal</div><div class="value">${fmt(t.income)}</div></div><div class="card stat"><div class="label">Despesas</div><div class="value">${fmt(t.expense)}</div></div><div class="card stat"><div class="label">Reserva</div><div class="value">${fmt(t.reserve)}</div></div><div class="card stat"><div class="label">Próximo objetivo</div><div class="value" style="font-size:1rem">${goal?esc(goal.name):'Nenhum objetivo ativo'}</div></div></div><div class="layout2"><div class="card"><div class="section-title"><div><h3>Visão do mês</h3><div class="forecast-note">Previsto, pendente e pago aparecem separadamente no status.</div></div><button class="btn" onclick="openTransaction()">+ Novo lançamento</button></div>${txTable(tx)}</div><div class="card consult"><h3>Resumo de ${monthLabel(currentPeriod)}</h3><p>Saldo projetado/realizado conforme os lançamentos cadastrados para o mês selecionado.</p><div class="value" style="font-size:1.5rem;font-weight:900;color:${t.balance>=0?'#79d7aa':'#ff9b9b'}">${fmt(t.balance)}</div><button class="btn secondary" style="margin-top:12px" onclick="showView('consultant')">Analisar orçamento</button></div></div>`}
function isProjection(x){return String(x.notes||'').includes('[PROJECTION]')}
function seriesId(x){const m=String(x.notes||'').match(/\[SERIES:([^\]]+)\]/);return m?m[1]:null}
function statusBadge(x){const m={paid:['green','Pago'],pending:['blue','Pendente'],planned:['gray',isProjection(x)?'Previsto':'Planejado'],overdue:['red','Atrasado'],cancelled:['gray','Cancelado']};const v=m[x.status]||['gray',esc(x.status||'')];if(x.kind==='expense'&&x.status==='pending')return `<span class="badge ${v[0]} pending-toggle" role="button" tabindex="0" title="Toque duas vezes para marcar como pago" onclick="pendingStatusTap(event,'${x.id}')">${v[1]}</span>`;return `<span class="badge ${v[0]}">${v[1]}</span>`}
function txTable(rows){if(!rows.length)return'<div class="empty">Nenhum lançamento cadastrado para este período.</div>';const desktop=`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Status</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.competence_date||''}</td><td>${esc(x.description)}</td><td>${esc(x.category)}</td><td>${statusBadge(x)}</td><td><span class="badge ${x.kind==='income'?'green':'red'}">${x.kind==='income'?'Renda':'Despesa'}</span></td><td>${fmt(x.amount)}</td><td style="display:flex;gap:6px">${seriesId(x)?`<button class="iconbtn" onclick="stopSeries('${seriesId(x)}')">Interromper</button>`:''}<button class="iconbtn" onclick="deleteRow('transactions','${x.id}')">Excluir</button></td></tr>`).join('')}</tbody></table></div>`;const mobile=`<div class="mobile-tx-list">${rows.map(x=>`<div class="mobile-tx-card"><div class="mobile-tx-top"><div class="mobile-tx-title">${esc(x.description)}</div><div class="mobile-tx-value">${fmt(x.amount)}</div></div><div class="mobile-tx-meta"><span class="badge ${x.kind==='income'?'green':'red'}">${x.kind==='income'?'Renda':'Despesa'}</span>${statusBadge(x)}<span class="badge gray">${esc(x.category)}</span></div><div class="mobile-tx-date">${x.competence_date||''}</div><div class="mobile-tx-actions">${seriesId(x)?`<button class="iconbtn" onclick="stopSeries('${seriesId(x)}')">Interromper série</button>`:''}<button class="iconbtn" onclick="deleteRow('transactions','${x.id}')">Excluir</button></div></div>`).join('')}</div>`;return desktop+mobile}
function renderTransactions(){const rows=monthTransactions().sort((a,b)=>String(b.competence_date).localeCompare(String(a.competence_date)));content.innerHTML=`<div class="card"><div class="section-title"><div><h3>Lançamentos</h3><div class="muted small">${monthLabel(currentPeriod)}</div></div><button class="btn" onclick="openTransaction()">+ Novo lançamento</button></div>${txTable(rows)}</div>`}
function renderFamily(){const monthInc=monthTransactions().filter(t=>t.kind==='income'),totalIncome=monthInc.reduce((s,t)=>s+Number(t.amount),0),cards=data.members.map(m=>{const value=monthInc.filter(t=>t.member_id===m.id).reduce((s,t)=>s+Number(t.amount),0),share=totalIncome?value/totalIncome*100:0;return `<div class="member-card"><h4>${esc(m.name)}</h4><div class="member-type">${m.kind==='adult'?'ADULTO':'DEPENDENTE'}</div><div class="muted small">${esc(m.relationship||'Familiar')}${m.income_earner?' · possui renda':''}</div>${m.income_earner?`<div class="member-share">${share.toFixed(1).replace('.',',')}% da renda familiar</div>`:''}</div>`}).join('');const inc=monthInc.slice(0,30);content.innerHTML=`<div class="card"><div class="section-title"><div><h3>Nosso Orçamento</h3><div class="muted small">${monthLabel(currentPeriod)} · todos os usuários autorizados veem as mesmas informações.</div></div><button class="btn" onclick="openMember()">+ Integrante</button></div><div class="member-grid">${cards||'<div class="empty">Nenhum integrante cadastrado.</div>'}</div></div><div class="card" style="margin-top:16px"><div class="section-title"><h3>Receitas do mês</h3><button class="btn" onclick="openTransaction('income')">+ Renda</button></div>${txTable(inc)}</div>`}
function renderBudget(){const cats={};monthTransactions().filter(t=>t.kind==='expense').forEach(t=>cats[t.category]=(cats[t.category]||0)+Number(t.amount));const total=Object.values(cats).reduce((a,b)=>a+b,0);content.innerHTML=`<div class="card"><div class="section-title"><div><h3>Distribuição das despesas</h3><div class="muted small">${monthLabel(currentPeriod)}</div></div><button class="btn" onclick="openTransaction('expense')">+ Despesa</button></div>${Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><strong>${esc(k)}</strong><span>${fmt(v)} · ${(v/total*100).toFixed(1)}%</span></div><div class="progress"><i style="width:${v/total*100}%"></i></div></div>`).join(''):'<div class="empty">Cadastre despesas para visualizar o orçamento.</div>'}</div>`}
function renderAccounts(){content.innerHTML=`<div class="layout2"><div class="card"><div class="section-title"><h3>Contas bancárias</h3><button class="btn" onclick="openAccount()">+ Conta</button></div>${listTable('bank_accounts',data.bank_accounts,[['name','Conta'],['institution','Instituição'],['balance','Saldo','money']])}</div><div class="card"><div class="section-title"><h3>Cartões</h3><button class="btn" onclick="openCard()">+ Cartão</button></div>${listTable('credit_cards',data.credit_cards,[['name','Cartão'],['last_digits','Final'],['current_invoice','Fatura','money']])}</div></div>`}
function renderExpenses(){content.innerHTML=`<div class="card"><div class="section-title"><div><h3>Despesas</h3><div class="muted small">${monthLabel(currentPeriod)}</div></div><button class="btn" onclick="openTransaction('expense')">+ Despesa</button></div>${txTable(monthTransactions().filter(t=>t.kind==='expense'))}</div>`}
function renderDebts(){content.innerHTML=`<div class="card"><div class="section-title"><h3>Dívidas</h3><button class="btn" onclick="openDebt()">+ Dívida</button></div>${listTable('debts',data.debts,[['name','Dívida'],['creditor','Credor'],['outstanding_balance','Saldo devedor','money'],['installment_amount','Parcela','money']])}</div>`}
function renderInvestments(){content.innerHTML=`<div class="card"><div class="section-title"><h3>Investimentos</h3><button class="btn" onclick="openInvestment()">+ Investimento</button></div>${listTable('investments',data.investments,[['name','Produto'],['institution','Instituição'],['product_type','Tipo'],['current_value','Valor atual','money']])}</div>`}
function renderGoals(){content.innerHTML=`<div class="card"><div class="section-title"><h3>Metas e planos</h3><button class="btn" onclick="openGoal()">+ Meta</button></div>${data.financial_goals.length?data.financial_goals.map(g=>{const p=Math.min(100,Number(g.current_amount)/Number(g.target_amount)*100);return`<div class="recommend"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${esc(g.name)}</strong><button class="iconbtn" onclick="deleteRow('financial_goals','${g.id}')">Excluir</button></div><div class="muted small">${esc(g.category)} · prioridade ${g.priority}</div><div class="progress" style="margin:9px 0"><i style="width:${p}%"></i></div><div>${fmt(g.current_amount)} de ${fmt(g.target_amount)} (${p.toFixed(0)}%)</div></div>`}).join(''):'<div class="empty">Nenhuma meta cadastrada.</div>'}</div>`}
function forecast12(){return Array.from({length:12},(_,i)=>{const m=addMonths(currentPeriod,i);return{month:m,...totals(m)}})}
function renderConsultant(){const t=totals(),future=forecast12(),recs=[];if(t.debt>0)recs.push(['Prioridade alta','Dívidas ativas','Mapeie taxa, parcela e saldo devedor. Priorize as dívidas de maior custo antes de ampliar aportes de longo prazo.']);if(t.expense>t.income&&t.income>0)recs.push(['Prioridade alta','Orçamento negativo','As despesas do mês superam a renda. Revise gastos variáveis e vencimentos antes de assumir novas parcelas.']);const negative=future.filter(x=>x.balance<0);if(negative.length)recs.push(['Projeção 12 meses','Atenção ao fluxo futuro',`${negative.length} dos próximos 12 meses apresentam saldo projetado negativo com os dados atuais.`]);if(t.reserve<t.expense*3&&t.expense>0)recs.push(['Prioridade média','Reserva de emergência','A reserva registrada está abaixo de três meses das despesas atuais.']);if(!recs.length)recs.push(['Acompanhamento','Estrutura inicial','Cadastre renda, despesas, dívidas, contas e metas para receber recomendações mais específicas.']);content.innerHTML=`<div class="card consult"><h3>Consultor Financeiro Familiar</h3><p>As recomendações usam os valores realizados e as projeções de até 12 meses cadastradas no app.</p>${recs.map(r=>`<div class="recommend" style="color:var(--ink)"><span class="badge blue">${r[0]}</span><h4>${r[1]}</h4><div>${r[2]}</div></div>`).join('')}</div>`}
function renderReports(){const t=totals(),future=forecast12();const cards=`<div class="mobile-forecast-list">${future.map(x=>`<div class="mobile-forecast-card"><strong>${monthLabel(x.month)}</strong><div class="mobile-forecast-row"><span class="mobile-forecast-label">Renda</span><span class="mobile-forecast-value">${fmt(x.income)}</span></div><div class="mobile-forecast-row"><span class="mobile-forecast-label">Despesas</span><span class="mobile-forecast-value">${fmt(x.expense)}</span></div><div class="mobile-forecast-row"><span class="mobile-forecast-label">Saldo</span><span class="mobile-forecast-value" style="color:${x.balance>=0?'var(--green)':'var(--red)'}">${fmt(x.balance)}</span></div></div>`).join('')}</div>`;content.innerHTML=`<div class="grid4"><div class="card stat"><div class="label">Renda · ${monthLabel(currentPeriod)}</div><div class="value">${fmt(t.income)}</div></div><div class="card stat"><div class="label">Despesas</div><div class="value">${fmt(t.expense)}</div></div><div class="card stat"><div class="label">Dívidas</div><div class="value">${fmt(t.debt)}</div></div><div class="card stat"><div class="label">Patrimônio financeiro</div><div class="value">${fmt(t.reserve)}</div></div></div><div class="card" style="margin-top:16px"><h3>Projeção de 12 meses</h3><div class="table-wrap"><table><thead><tr><th>Mês</th><th>Renda</th><th>Despesas</th><th>Saldo</th></tr></thead><tbody>${future.map(x=>`<tr><td>${monthLabel(x.month)}</td><td>${fmt(x.income)}</td><td>${fmt(x.expense)}</td><td style="font-weight:900;color:${x.balance>=0?'var(--green)':'var(--red)'}">${fmt(x.balance)}</td></tr>`).join('')}</tbody></table></div>${cards}</div>`}
function listTable(table,rows,cols){if(!rows.length)return'<div class="empty">Nenhum registro cadastrado.</div>';const desktop=`<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[2]==='money'?fmt(r[c[0]]):esc(r[c[0]])}</td>`).join('')}<td><button class="iconbtn" onclick="deleteRow('${table}','${r.id}')">Excluir</button></td></tr>`).join('')}</tbody></table></div>`;const mobile=`<div class="mobile-record-list">${rows.map(r=>`<div class="mobile-record-card">${cols.map(c=>`<div class="mobile-record-row"><span class="mobile-record-label">${c[1]}</span><span class="mobile-record-value">${c[2]==='money'?fmt(r[c[0]]):esc(r[c[0]])}</span></div>`).join('')}<div class="mobile-record-actions"><button class="iconbtn" onclick="deleteRow('${table}','${r.id}')">Excluir</button></div></div>`).join('')}</div>`;return desktop+mobile}
function modal(title,body,save){modalRoot.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="iconbtn" onclick="closeModal()">✕</button></div>${body}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="${save}">Salvar</button></div><div id="modalMsg"></div></div></div>`}
function closeModal(){modalRoot.innerHTML=''}function modalErr(e){modalMsg.innerHTML=`<div class="msg err">${esc(e.message||e)}</div>`}
async function insert(table,payload){const {error}=await sb.from(table).insert({...payload,family_id:familyId});if(error)throw error;closeModal();await refreshAll()}
async function deleteRow(table,id){if(!confirm('Excluir este registro?'))return;const {error}=await sb.from(table).delete().eq('id',id);if(error)return alert(error.message);await refreshAll()}
let pendingTap={id:null,time:0};
function pendingStatusTap(event,id){event.preventDefault();event.stopPropagation();const now=Date.now();if(pendingTap.id===id&&now-pendingTap.time<500){pendingTap={id:null,time:0};openPaymentConfirm(id);return}pendingTap={id,time:now}}
function openPaymentConfirm(id){modalRoot.innerHTML=`<div class="modal-bg payment-confirm-bg" onclick="if(event.target===this)closeModal()"><div class="payment-confirm"><div class="payment-confirm-title">Confirmar pagamento?</div><div class="payment-confirm-actions"><button class="btn secondary" onclick="closeModal()">Não</button><button class="btn" onclick="confirmExpensePaid('${id}')">Sim</button></div></div></div>`}
async function confirmExpensePaid(id){const paidAt=new Date().toISOString().slice(0,10);const {error}=await sb.from('transactions').update({status:'paid',paid_at:paidAt}).eq('id',id).eq('family_id',familyId).eq('kind','expense').eq('status','pending');if(error)return alert(error.message);closeModal();await refreshAll()}
const memberOptions=()=>`<option value="">Sem vínculo</option>${data.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}`;
function openTransaction(kind='expense'){modal(kind==='income'?'Nova renda':'Nova despesa',`<div class="form-grid"><div class="field"><label>Tipo</label><select id="fkind" onchange="toggleRecurrenceFields()"><option value="income" ${kind==='income'?'selected':''}>Renda</option><option value="expense" ${kind==='expense'?'selected':''}>Despesa</option></select></div><div class="field"><label>Data</label><input id="fdate" type="date" value="${currentPeriod}-01"></div><div class="field span2"><label>Descrição</label><input id="fdesc"></div><div class="field"><label>Categoria</label><input id="fcat" placeholder="Ex.: Moradia, Salário"></div><div class="field"><label>Valor</label><input id="famount" type="number" step="0.01" min="0"></div><div class="field"><label>Integrante</label><select id="fmember">${memberOptions()}</select></div><div class="field"><label>Status</label><select id="fstatus"><option value="paid">Pago/recebido</option><option value="pending">Pendente</option><option value="planned">Previsto</option></select></div><div class="field"><label>Recorrência</label><select id="frecur" onchange="toggleRecurrenceFields()"><option value="once">Uma vez</option><option value="monthly">Mensal recorrente</option></select></div><div class="field" id="fcountWrap" style="display:none"><label>Quantidade de meses</label><input id="fcount" type="number" min="2" max="12" value="12"></div><div class="field span2" id="fvariableWrap" style="display:none"><label>Despesa variável?</label><select id="fvariable"><option value="fixed">Não, valor fixo</option><option value="variable_average">Sim, projetar pela média do histórico</option></select><div class="forecast-note">Para despesas variáveis, o app usa até os últimos 12 meses disponíveis. Sem histórico, o valor informado funciona como estimativa inicial.</div></div></div>`,'saveTransaction()');toggleRecurrenceFields()}
function toggleRecurrenceFields(){if(typeof frecur==='undefined')return;const recurring=frecur.value!=='once';fcountWrap.style.display=recurring?'grid':'none';fvariableWrap.style.display=recurring&&fkind.value==='expense'?'grid':'none'}
function variableAverage(category,memberId){const hist=data.transactions.filter(t=>t.kind==='expense'&&!isProjection(t)&&t.status!=='cancelled'&&t.category===category&&(!memberId||t.member_id===memberId)).sort((a,b)=>String(b.competence_date).localeCompare(String(a.competence_date))).slice(0,12);return hist.length?hist.reduce((s,t)=>s+Number(t.amount),0)/hist.length:null}
function safeDateForMonth(ym,day){const [y,m]=ym.split('-').map(Number),last=new Date(y,m,0).getDate();return `${ym}-${String(Math.min(day,last)).padStart(2,'0')}`}
async function saveTransaction(){try{const base={kind:fkind.value,description:fdesc.value.trim(),category:fcat.value.trim()||'Outros',amount:Number(famount.value),competence_date:fdate.value,status:fstatus.value,member_id:fmember.value||null,paid_at:fstatus.value==='paid'?fdate.value:null,recurrence:frecur.value==='monthly'?'monthly':'once'};if(!base.description||!base.amount||!base.competence_date)throw new Error('Preencha descrição, valor e data.');if(frecur.value==='once'){await insert('transactions',base);return}const count=Math.max(2,Math.min(12,Number(fcount.value||12))),series=crypto.randomUUID(),recurrenceType=(fkind.value==='expense'&&fvariable?.value==='variable_average')?'variable_average':'fixed',day=Number(base.competence_date.slice(8,10));const rows=[{...base,family_id:familyId,notes:`[SERIES:${series}][SOURCE][TYPE:${recurrenceType}]`}];for(let i=1;i<count;i++){const ym=addMonths(base.competence_date.slice(0,7),i),amount=recurrenceType==='variable_average'?(variableAverage(base.category,base.member_id)??base.amount):base.amount;rows.push({...base,family_id:familyId,amount,competence_date:safeDateForMonth(ym,day),status:'planned',paid_at:null,notes:`[SERIES:${series}][PROJECTION][TYPE:${recurrenceType}]`})}const {error}=await sb.from('transactions').insert(rows);if(error)throw error;closeModal();await refreshAll()}catch(e){modalErr(e)}}
async function stopSeries(id){if(!confirm('Interromper esta recorrência e remover somente as projeções futuras?'))return;const from=new Date().toISOString().slice(0,7)+'-01';const {error}=await sb.from('transactions').delete().eq('family_id',familyId).eq('status','planned').like('notes',`%[SERIES:${id}]%`).like('notes','%[PROJECTION]%').gte('competence_date',from);if(error)return alert(error.message);await refreshAll()}
function openMember(){modal('Novo integrante',`<div class="form-grid"><div class="field span2"><label>Nome</label><input id="mname"></div><div class="field"><label>Parentesco</label><input id="mrel" placeholder="Ex.: Titular, cônjuge, filho(a)"></div><div class="field"><label>Tipo</label><select id="mkind"><option value="adult">Adulto</option><option value="dependent">Dependente</option></select></div><div class="field"><label>Data de nascimento</label><input id="mbirth" type="date"></div><div class="field"><label>Recebe renda?</label><select id="mearner"><option value="false">Não</option><option value="true">Sim</option></select></div></div>`,'saveMember()')}
async function saveMember(){try{await insert('members',{name:mname.value.trim(),relationship:mrel.value.trim()||'Familiar',kind:mkind.value,birth_date:mbirth.value||null,income_earner:mearner.value==='true'})}catch(e){modalErr(e)}}
function openAccount(){modal('Nova conta bancária',`<div class="form-grid"><div class="field"><label>Nome</label><input id="aname"></div><div class="field"><label>Instituição</label><input id="ainst"></div><div class="field"><label>Tipo</label><input id="atype" placeholder="Corrente, pagamento..."></div><div class="field"><label>Saldo</label><input id="abal" type="number" step="0.01" value="0"></div><div class="field"><label>Tarifa mensal</label><input id="afee" type="number" step="0.01" value="0"></div><div class="field"><label>Rendimento automático?</label><select id="ayield"><option value="false">Não</option><option value="true">Sim</option></select></div></div>`,'saveAccount()')}
async function saveAccount(){try{await insert('bank_accounts',{name:aname.value.trim(),institution:ainst.value.trim(),account_type:atype.value.trim()||'Conta',balance:Number(abal.value||0),monthly_fee:Number(afee.value||0),automatic_yield:ayield.value==='true'})}catch(e){modalErr(e)}}
function openCard(){modal('Novo cartão',`<div class="form-grid"><div class="field span2"><label>Nome</label><input id="cname"></div><div class="field"><label>4 últimos dígitos</label><input id="cdigits" maxlength="4"></div><div class="field"><label>Limite</label><input id="climit" type="number" step="0.01" value="0"></div><div class="field"><label>Fatura atual</label><input id="cinvoice" type="number" step="0.01" value="0"></div><div class="field"><label>Vencimento (dia)</label><input id="cdue" type="number" min="1" max="31"></div></div>`,'saveCard()')}
async function saveCard(){try{await insert('credit_cards',{name:cname.value.trim(),last_digits:cdigits.value.trim()||null,credit_limit:Number(climit.value||0),family_limit:Number(climit.value||0),current_invoice:Number(cinvoice.value||0),due_day:cdue.value?Number(cdue.value):null})}catch(e){modalErr(e)}}
function openDebt(){modal('Nova dívida',`<div class="form-grid"><div class="field"><label>Nome</label><input id="dname"></div><div class="field"><label>Credor</label><input id="dcred"></div><div class="field"><label>Tipo</label><input id="dtype"></div><div class="field"><label>Saldo devedor</label><input id="dbal" type="number" step="0.01"></div><div class="field"><label>Parcela</label><input id="dinst" type="number" step="0.01" value="0"></div><div class="field"><label>Taxa mensal %</label><input id="drate" type="number" step="0.01" value="0"></div></div>`,'saveDebt()')}
async function saveDebt(){try{await insert('debts',{name:dname.value.trim(),creditor:dcred.value.trim(),debt_type:dtype.value.trim()||'Outros',outstanding_balance:Number(dbal.value),installment_amount:Number(dinst.value||0),monthly_rate_percent:Number(drate.value||0)})}catch(e){modalErr(e)}}
function openInvestment(){modal('Novo investimento',`<div class="form-grid"><div class="field"><label>Instituição</label><input id="iinst"></div><div class="field"><label>Produto</label><input id="iname"></div><div class="field"><label>Tipo</label><input id="itype" placeholder="CDB, Tesouro..."></div><div class="field"><label>Valor investido</label><input id="iinv" type="number" step="0.01" value="0"></div><div class="field"><label>Valor atual</label><input id="icurr" type="number" step="0.01" value="0"></div><div class="field"><label>Liquidez</label><input id="iliq"></div></div>`,'saveInvestment()')}
async function saveInvestment(){try{await insert('investments',{institution:iinst.value.trim(),name:iname.value.trim(),product_type:itype.value.trim()||'Investimento',invested_amount:Number(iinv.value||0),current_value:Number(icurr.value||0),liquidity:iliq.value.trim()||null})}catch(e){modalErr(e)}}
function openGoal(){modal('Nova meta',`<div class="form-grid"><div class="field"><label>Nome</label><input id="gname"></div><div class="field"><label>Categoria</label><input id="gcat" placeholder="Viagem, veículo, reserva..."></div><div class="field"><label>Valor-alvo</label><input id="gtarget" type="number" step="0.01"></div><div class="field"><label>Valor atual</label><input id="gcurrent" type="number" step="0.01" value="0"></div><div class="field"><label>Aporte mensal</label><input id="gmonthly" type="number" step="0.01" value="0"></div><div class="field"><label>Prioridade (1-5)</label><input id="gpriority" type="number" min="1" max="5" value="3"></div></div>`,'saveGoal()')}
async function saveGoal(){try{await insert('financial_goals',{name:gname.value.trim(),category:gcat.value.trim()||'Objetivo',target_amount:Number(gtarget.value),current_amount:Number(gcurrent.value||0),monthly_contribution:Number(gmonthly.value||0),priority:Number(gpriority.value||3)})}catch(e){modalErr(e)}}
function renderFatal(msg){content.innerHTML=`<div class="msg err">${esc(msg)}</div>`}
(async()=>{const {data:{session:s}}=await sb.auth.getSession();session=s;if(s)boot()})();
</script>
</body>
</html>
